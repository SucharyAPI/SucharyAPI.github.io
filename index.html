<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SucharyAPI - Polska baza dowcipów</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <div id="app">
      <main class="startowa">
        <h3 class="naglowek-glowny">SucharyAPI - ogólnopolska baza kawałów i dowcipów</h3>

          <div class="tekst">
            <h1>Masz kawał?</h1>
            <h1>Zgłoś go do naszej bazy!</h1>

          <div class="guziki">
            <button id="github" class="zglos">
              <img src="./src/assets/github.png" class="pic">
              <h3>Zgłoś poprzez Github</h3>
            </button>
            <button id="forms" class="zglos">
              <img src="./src/assets/google-forms.png" class="pic">
              <h3>Zgłoś poprzez Formularze Google</h3>
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
