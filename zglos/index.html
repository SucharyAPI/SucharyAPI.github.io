<!DOCTYPE html>
<html lang="pl">
    <head>
        <title>Zgłoś kawał do bazy | SucharyAPI</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../style/main.css">
        <link rel="stylesheet" href="../style/zglos.css">
    </head>
    <body>
        <main>
            <div style="height: 3rem;"></div>
            <section class="tekst">
                <h1>Masz kawał?</h1>
                <h1>Zgłoś go do naszej bazy!</h1>
            </section>
            <div style="height: 1rem;"></div>
            <section class="guziki">
                <button id="github" class="zglos">
                    <img class="obrazek" src="../assets/github.png">
                    <div style="width: 0.5rem;"></div>
                    <h3>Zgłoś poprzez Github</h3>
                </button>
                <div style="width: 1rem;"></div>
                <button id="forms" class="zglos">
                    <div style="width: 1.2rem;"></div>
                    <img class="obrazek" src="../assets/google-forms.png">
                    <h3>Zgłoś poprzez Formularze Google</h3>
                </button>
            </section>
        </main>
        <div style="height: 10rem;"></div>
        <footer style="padding-left: 3%;">
            <p>&copy; 2026 SucharyAPI. Wszelkie prawa zastrzeżone.</p>
        </footer>

        <script type="module" src="../scripts/zglos.ts"></script>
    </body>
</html>
